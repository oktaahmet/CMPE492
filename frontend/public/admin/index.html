<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scheduler Admin</title>
    <link rel="stylesheet" href="/admin/styles.css" />
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel auth-panel" id="authCard">
        <form class="auth-form" id="authForm">
          <label class="auth-title" for="tokenInput">Admin Token</label>
          <input id="tokenInput" type="password" autocomplete="current-password" placeholder="ADMIN_API_TOKEN" />
          <span class="badge" id="sessionPill">Locked</span>
          <button class="button primary" id="unlockBtn" type="submit">Unlock</button>
        </form>
      </section>

      <section class="workspace" id="adminPanel" hidden>
        <section class="panel upload-panel">
          <div class="panel-heading">
            <h2><span class="section-icon">⇧</span> Upload Workflow</h2>
          </div>

          <div class="file-grid">
            <label class="file-drop">
              <span>Workflow JSON</span>
              <input id="workflowJsonInput" type="file" accept=".json,application/json" />
              <strong class="file-control">Choose JSON</strong>
            </label>
            <label class="file-drop">
              <span>C++ files</span>
              <input id="cppFilesInput" type="file" accept=".cpp" multiple />
              <strong class="file-control">Choose C++ files</strong>
            </label>
            <label class="file-drop">
              <span>Workflow input files</span>
              <input id="workflowInputFilesInput" type="file" multiple />
              <strong class="file-control">Choose input files</strong>
            </label>
          </div>

          <ul id="cppFilesList" class="file-list"></ul>
          <ul id="workflowJsonList" class="file-list"></ul>
          <ul id="workflowInputFilesList" class="file-list"></ul>

          <div class="actions compact-actions">
            <button class="button primary" id="uploadBtn" type="button">Upload</button>
          </div>
        </section>

        <section class="panel controls-panel">
          <div class="panel-heading">
            <h2><span class="section-icon">▦</span> Active Workflow</h2>
            <span class="panel-kicker" id="statusLine">No workflow loaded</span>
          </div>

          <div class="control-grid">
            <label class="field">
              <span>Workflow</span>
              <select id="workflowSelect"></select>
            </label>
            <label class="field">
              <span>Topology</span>
              <select id="topologyModeSelect">
                <option value="plain">Plain topological sort</option>
                <option value="priority_aware">Priority-aware topological sort</option>
              </select>
            </label>
          </div>

          <label class="check-row">
            <input id="resetStateInput" type="checkbox" />
            <span>Reset DB node state before activation</span>
          </label>

          <div class="actions">
            <button class="button primary" id="activateBtn" type="button">Activate</button>
            <button class="button secondary" id="refreshBtn" type="button">Refresh</button>
            <button class="button ghost danger-text" id="deleteBtn" type="button">Delete</button>
          </div>
        </section>
      </section>

      <section class="maintenance-row" id="maintenancePanel" hidden>
        <button class="button secondary" id="requeuePaymentsBtn" type="button">Requeue Interrupted Payments</button>
      </section>

      <section class="panel output-panel" id="outputPanel" hidden>
        <div class="panel-heading">
          <h2>Logs</h2>
          <button class="button ghost" id="clearOutputBtn" type="button">Clear</button>
        </div>
        <pre id="output">Ready.</pre>
      </section>
    </main>
  </body>
</html>
