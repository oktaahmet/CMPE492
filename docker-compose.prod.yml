name: x402-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-x402_scheduler_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    image: x402-scheduler:prod
    build:
      context: ./scheduler
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${PROD_ENV_FILE:-.env.production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - scheduler_uploaded_workflows:/app/workflows/uploaded
      - scheduler_uploaded_static:/app/static/uploaded
      - scheduler_workflow_data:/app/workflow-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: x402-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      scheduler:
        condition: service_healthy

volumes:
  postgres_data:
  scheduler_uploaded_workflows:
  scheduler_uploaded_static:
  scheduler_workflow_data:
