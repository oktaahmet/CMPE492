name: x402-dev

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: x402_scheduler_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  scheduler:
    image: x402-scheduler:dev
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    volumes:
      - ./scheduler/app:/app
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: x402-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://scheduler:8080
      VITE_WORKER_BUSY_LOOP_DELAY_MS: ${VITE_WORKER_BUSY_LOOP_DELAY_MS:-0}
      VITE_WORKER_IDLE_DELAY_INITIAL_MS: ${VITE_WORKER_IDLE_DELAY_INITIAL_MS:-250}
      VITE_WORKER_IDLE_DELAY_MAX_MS: ${VITE_WORKER_IDLE_DELAY_MAX_MS:-5000}
      VITE_WORKER_IDLE_DELAY_MULTIPLIER: ${VITE_WORKER_IDLE_DELAY_MULTIPLIER:-2}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      scheduler:
        condition: service_healthy

volumes:
  postgres_data:
    name: x402_postgres_data
  frontend_modules:
    name: x402_frontend_modules
